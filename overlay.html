<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hushboard: keyboard locked</title>
  </head>
  <body>
    <main class="hb-overlay">
      <div class="hb-overlay__center">
        <p class="hb-overlay__status" aria-live="polite">Keyboard locked</p>

        <div class="hb-overlay__timer" id="countdown" role="timer" aria-label="Time left">
          <span class="hb-overlay__time" id="time">–:––</span>
          <span class="hb-overlay__bar" aria-hidden="true"><span id="bar"></span></span>
        </div>
        <p class="hb-overlay__forever" id="forever" hidden>Unlock when you're done</p>

        <div class="hb-keys hb-overlay__keys" id="keys" aria-label="Last keys ignored"></div>
      </div>

      <div class="hb-overlay__exit">
        <button class="hb-hold hb-overlay__hold" id="hold" type="button" aria-describedby="hold-hint">
          <span id="hold-label">Hold to unlock</span>
        </button>
        <p class="hb-overlay__hint" id="hold-hint">
          <span>or press</span>
          <span class="hb-kbd" id="escape-keys"></span>
        </p>
      </div>
    </main>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
