<!-- @dsCard group="Screens" height=620 subtitle="The full-screen view while the keyboard is locked" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>LockOverlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@200..600&display=swap">
<style>html, body { height: 100%; }</style>
</head>
<body>
<main class="hb-overlay">
  <div class="hb-overlay__center">
    <p class="hb-overlay__status">Keyboard locked</p>
    <div class="hb-overlay__timer" role="timer" aria-label="1 minute 42 seconds left">
      <span class="hb-overlay__time">1:42</span>
      <span class="hb-overlay__bar" aria-hidden="true"><span style="transform:scaleX(0.85)"></span></span>
    </div>
    <div class="hb-keys hb-overlay__keys" aria-label="Last keys ignored">
      <span class="hb-key">J</span>
      <span class="hb-key">K</span>
      <span class="hb-key">⏎</span>
      <span class="hb-key hb-key--fresh">L</span>
    </div>
  </div>
  <div class="hb-overlay__exit">
    <button class="hb-hold hb-overlay__hold" type="button" aria-describedby="ov-hint">
      Hold to unlock
    </button>
    <p class="hb-overlay__hint" id="ov-hint">
      <span>or press</span>
      <span class="hb-kbd"><kbd>⌃</kbd><kbd>⌥</kbd><kbd>U</kbd></span>
    </p>
  </div>
</main>
</body>
</html>
