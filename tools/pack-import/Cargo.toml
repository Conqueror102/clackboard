[package]
name = "pack-import"
version = "0.1.0"
edition = "2021"
publish = false
description = "Imports keyboard sound sets (Keyboard Sounds profiles, bucklespring) as Clackboard packs."
license = "MIT"

[dependencies]
keylock = { path = "../../crates/keylock" }
rodio = { version = "0.20", default-features = false, features = ["vorbis", "wav", "mp3", "flac"] }
serde_json = "1"
serde_yaml = "0.9"
