[package]
name = "clackboard"
version = "0.1.0"
description = "Mechanical keyboard sounds, and a keyboard lock for cleaning."
edition = "2021"
license = "MIT"
repository = "https://github.com/Conqueror102/clackboard"

[lib]
name = "clackboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keylock = { path = "../crates/keylock" }
# Signed in-app updates from GitHub Releases, and "Start at login".
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
# Keyboard sounds: decoding packs (ogg, wav, mp3, flac) and audio output (cpal).
rodio = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
# Window level above the menu bar for the notch island, and notch detection.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
